    <script>
    // On utilise protectPage qui vient de auth-check.js
    protectPage((user) => {
        console.log("Accès autorisé pour :", user.email);
        fetchStaffData(); 
    });

    async function fetchStaffData() {
        try {
            // Utilisation de _db (défini dans auth-check.js)
            const { data, error } = await _db
                .from('sales') // Ou 'staff' selon ce que tu veux afficher ici
                .select('*')
                .eq('user_id', currentUser.id)
                .order('date', { ascending: false });

            if (error) throw error;

            if (data) {
                console.log("Données reçues :", data);
                // Si tu as une variable globale pour stocker les données
                if (typeof salesData !== 'undefined') salesData = data;
                
                // Appelle ta fonction de rendu du tableau
                if (typeof renderTable === 'function') {
                    renderTable();
                } else if (typeof renderStaff === 'function') {
                    renderStaff();
                }
            }
        } catch (err) {
            console.error("Erreur critique lors du chargement :", err.message);
        }
    }
</script>

    <main class="main-content">
    <header class="header-flex">
        <div>
            <h2>Paramètres & Profil</h2>
            <p id="userEmailDisplay" style="font-size: 0.85rem; color: var(--secondary); font-weight: 600;">Chargement du compte...</p>
        </div>
        <button class="btn-save" onclick="saveAllData()" style="margin:0; width:auto; padding:10px 25px;">Enregistrer Tout</button>
    </header>

    <div class="settings-grid">
        <div class="card">
            <h3><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Identité Admin</h3>
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="position: relative; display: inline-block;">
                    <img id="avatarPreview" src="https://ui-avatars.com/api/?name=Admin&background=1f3c63&color=fff" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border-soft);">
                    <input type="file" id="avatarInput" hidden accept="image/*" onchange="previewAvatar()">
                    <button onclick="document.getElementById('avatarInput').click()" style="position: absolute; bottom: 0; right: 0; background: var(--secondary); border: none; border-radius: 50%; width: 25px; height: 25px; color: white; cursor: pointer;">+</button>
                </div>
            </div>
            <div class="form-group">
                <label>Nom Complet</label>
                <input type="text" id="adminFullName" placeholder="Ex: Jean Dupont">
            </div>
            <div class="form-group">
                <label>Rôle / Titre</label>
                <input type="text" id="adminRole" value="Administrateur Principal" readonly style="background: var(--bg-body); opacity: 0.7;">
            </div>
        </div>

        <div class="card">
            <h3><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg> Entreprise</h3>
            <div class="form-group">
                <label>Nom du Business</label>
                <input type="text" id="bizName" placeholder="Ex: Moniteo Umbrella Ltd">
            </div>
            <div class="form-group">
                <label>Adresse physique</label>
                <textarea id="bizAddress" rows="2" placeholder="Kinshasa, Gombe..."></textarea>
            </div>
            <div class="form-group">
                <label>Logo du Business</label>
                <input type="file" id="bizLogoInput" accept="image/*" onchange="previewLogo()">
                <div style="margin-top:10px; text-align:center;">
                    <img id="logoPreview" src="" style="max-height: 40px; display:none; margin: 0 auto;">
                </div>
            </div>
        </div>

        <div class="card">
            <h3><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg> Préférences Système</h3>
            <div class="form-group">
                <label>Devise de base</label>
                <select id="baseCurrency">
                    <option value="$">Dollar ($)</option>
                    <option value="FC">Franc Congolais (FC)</option>
                    <option value="€">Euro (€)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Taux de change (1$ = ? FC)</label>
                <input type="number" id="exchangeRate" placeholder="Ex: 2850">
            </div>
            <div class="toggle-item">
                <span>Mode Sombre</span>
                <label class="switch">
                    <input type="checkbox" id="darkToggle" onchange="toggleDarkModeUI()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="card danger-zone">
            <h3 style="color: var(--danger);">Zone de Danger</h3>
            <button class="btn-danger-soft" onclick="resetApp()" style="margin-bottom: 10px;">Réinitialiser les données</button>
            <button class="btn-outline" onclick="logout()" style="width: 100%; justify-content: center; color: var(--danger);">Déconnexion</button>
        </div>
    </div>
</main>


<script>
    // --- VARIABLES GLOBALES ---
    let base64Logo = "";
    let base64Avatar = "";
    let currentUser = null;

    // --- INITIALISATION ---
    window.addEventListener('DOMContentLoaded', async () => {
        // Attendre un court instant pour s'assurer que _db est prêt
        setTimeout(async () => {
            try {
                // 1. Récupérer l'utilisateur connecté
                const { data: { user } } = await _db.auth.getUser();
                if (!user) { 
                    window.location.href = "index.html"; 
                    return; 
                }
                currentUser = user;
                document.getElementById('userEmailDisplay').textContent = "Connecté : " + user.email;

                // 2. Charger les données du Profil et des Settings
                await loadAllData();
            } catch (err) {
                console.error("Erreur d'initialisation:", err.message);
            }
        }, 100);
    });

    async function loadAllData() {
        try {
            // A. Charger les données du Profil (Table: profiles)
            const { data: profile } = await _db.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                document.getElementById('adminFullName').value = profile.full_name || "";
                if (profile.avatar_url) {
                    document.getElementById('avatarPreview').src = profile.avatar_url;
                    base64Avatar = profile.avatar_url;
                }
            }

            // B. Charger les Settings (Table: settings)
            const { data: settings } = await _db.from('settings').select('*').eq('user_id', currentUser.id).maybeSingle();
            if (settings) {
                document.getElementById('bizName').value = settings.company_name || "";
                document.getElementById('bizAddress').value = settings.address || "";
                document.getElementById('baseCurrency').value = settings.currency || "$";
                document.getElementById('exchangeRate').value = settings.rate || "";
                document.getElementById('darkToggle').checked = settings.dark_mode;
                
                if (settings.logo_url) {
                    const preview = document.getElementById('logoPreview');
                    preview.src = settings.logo_url;
                    preview.style.display = 'block';
                    base64Logo = settings.logo_url;
                }
                
                // Appliquer le mode sombre visuellement
                if (settings.dark_mode) document.body.classList.add('dark-mode');
            }
        } catch (err) {
            console.error("Erreur lors du chargement des données:", err.message);
        }
    }

    // --- GESTION DES IMAGES (PREVIEWS) ---
    function previewAvatar() {
        const file = document.getElementById('avatarInput').files[0];
        const reader = new FileReader();
        reader.onloadend = () => {
            base64Avatar = reader.result;
            document.getElementById('avatarPreview').src = base64Avatar;
        };
        if (file) reader.readAsDataURL(file);
    }

    function previewLogo() {
        const file = document.getElementById('bizLogoInput').files[0];
        const reader = new FileReader();
        reader.onloadend = () => {
            base64Logo = reader.result;
            const preview = document.getElementById('logoPreview');
            preview.src = base64Logo;
            preview.style.display = 'block';
        };
        if (file) reader.readAsDataURL(file);
    }

    // --- SAUVEGARDE GLOBALE ---
    async function saveAllData() {
        const saveBtn = document.querySelector('.btn-save');
        const originalText = saveBtn.textContent;
        
        saveBtn.textContent = "⏳ Enregistrement...";
        saveBtn.disabled = true;

        try {
            // 1. Sauvegarde Profil (Table: profiles)
            const { error: pErr } = await _db.from('profiles').upsert({
                id: currentUser.id,
                full_name: document.getElementById('adminFullName').value,
                avatar_url: base64Avatar,
                updated_at: new Date()
            });

            // 2. Sauvegarde Settings (Table: settings)
            const { error: sErr } = await _db.from('settings').upsert({
                user_id: currentUser.id,
                company_name: document.getElementById('bizName').value,
                address: document.getElementById('bizAddress').value,
                currency: document.getElementById('baseCurrency').value,
                rate: parseFloat(document.getElementById('exchangeRate').value) || 0,
                dark_mode: document.getElementById('darkToggle').checked,
                logo_url: base64Logo,
                updated_at: new Date()
            }, { onConflict: 'user_id' });

            if (pErr || sErr) throw new Error("Erreur de synchronisation Supabase.");

            alert("✅ Configuration mise à jour avec succès !");
            location.reload(); // Recharge pour appliquer les changements partout
            
        } catch (err) {
            alert("Erreur lors de la sauvegarde: " + err.message);
            saveBtn.textContent = originalText;
            saveBtn.disabled = false;
        }
    }

    // --- INTERFACE & SIDEBAR ---
    function toggleDarkModeUI() {
        const isChecked = document.getElementById('darkToggle').checked;
        document.body.classList.toggle('dark-mode', isChecked);
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebarStatus', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
    }

    // Appliquer l'état de la sidebar au chargement
    (function() {
        const status = localStorage.getItem('sidebarStatus');
        if (status === 'collapsed') {
            document.getElementById('sidebar')?.classList.add('collapsed');
        }
    })();

    // --- DECONNEXION ---
    async function logout() {
        if (confirm("Voulez-vous vous déconnecter ?")) {
            await _db.auth.signOut();
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    }

    // --- ZONE DE DANGER ---
    function resetApp() {
        if (confirm("⚠️ ATTENTION : Cela va effacer vos préférences locales. Les données Supabase resteront intactes. Continuer ?")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>
</body>
</html>
