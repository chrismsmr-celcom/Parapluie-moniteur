<script>
    // protectPage vient de auth-check.js
    protectPage(async (user) => {
        console.log("✅ Accès autorisé :", user.email);
        // On passe directement l'objet 'user' pour éviter d'utiliser un 'currentUser' global non défini
        await fetchStaffData(user); 
    });

    async function fetchStaffData(user) {
        try {
            // On vérifie que la DB est prête
            const db = window._db || _db;
            if (!db) throw new Error("Base de données non initialisée");

            const { data, error } = await db
                .from('staff') // Si c'est la page personnel, utilise 'staff'
                .select('*')
                .eq('user_id', user.id) // Utilise user.id du paramètre
                .order('name', { ascending: true });

            if (error) throw error;

            if (data) {
                console.log("👥 Membres du personnel récupérés :", data.length);
                
                // On attache les données à window pour les rendre accessibles partout
                window.staffData = data;
                
                // Rendu visuel
                if (typeof renderStaff === 'function') {
                    renderStaff(data);
                } else if (typeof renderTable === 'function') {
                    renderTable();
                }
            }
        } catch (err) {
            console.error("❌ Erreur de chargement :", err.message);
        }
    }
</script>

<script>
    let expenses = [];
    let globalRate = 2200; // Taux par défaut si non trouvé

    // --- 2. INITIALISATION ---
    document.addEventListener('DOMContentLoaded', async () => {
    // 1. Appliquer les réglages (Mode sombre, devise, etc.)
    applyGlobalSettings();

    // 2. Initialiser la date du jour
    const dateInput = document.getElementById('expenseDate');
    if (dateInput) {
        dateInput.valueAsDate = new Date();
    }

    // 3. SAUVEGARDE DE L'ID UTILISATEUR (Pour le mode hors-ligne)
    try {
        const { data: { user } } = await _db.auth.getUser();
        if (user) {
            localStorage.setItem('moniteo_user_id', user.id);
            console.log("✅ ID Utilisateur synchronisé pour le mode hors-ligne");
        }
    } catch (err) {
        console.warn("⚠️ Impossible de récupérer l'ID (Hors-ligne ?)");
    }

    // 4. Charger les données (Si on a internet, fetchExpenses s'en occupe)
    fetchExpenses();

    // 5. Écouteur pour le changement de devise globale
    const currencySelector = document.getElementById('expenseCurrency');
    if (currencySelector) {
        currencySelector.addEventListener('change', renderExpenses);
    }
});
    // --- 3. APPLICATION DES RÉGLAGES (CACHE & UI) ---
function applyGlobalSettings() {
    const config = JSON.parse(localStorage.getItem('moniteo_config')) || {};
    
    // 1. Variables Globales
    if (typeof globalRate !== 'undefined') globalRate = config.rate || 2800;
    if (typeof currentCurrency !== 'undefined') currentCurrency = config.currency || "FC";

    // 2. Mode Sombre
    if (config.darkMode) {
        document.body.classList.add('dark-mode');
    } else {
        document.body.classList.remove('dark-mode');
    }

    // 3. Titre et Nom de l'entreprise
    const title = document.getElementById('companyTitle');
    if (title && config.name) {
        title.innerHTML = `Tableau de Bord <small style="font-size:0.6em; color:var(--secondary)">| ${config.name}</small>`;
    }

    // 4. Logo Dynamique
    const logoCont = document.getElementById('dynamicLogoContainer');
    if (logoCont) {
        if (config.logo) {
            logoCont.innerHTML = `<img src="${config.logo}" style="height: 40px; width: auto; border-radius: 4px; object-fit: contain;">`;
        } else {
            logoCont.innerHTML = ""; // Vide si pas de logo
        }
    }

    // 5. Affichages spécifiques (Matricule, etc.)
    const displayMat = document.getElementById('displayMatricule');
    if (displayMat && config.matricule) displayMat.innerText = config.matricule;

    const displayComp = document.getElementById('company-display');
    if (displayComp && config.name) displayComp.innerText = config.name;
}

    // --- 3. LOGIQUE DE CALCUL (DYNAMIQUE) ---
    function convertCurrency(amount, fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return amount;
        
        // Si on convertit du Dollar vers le Franc Congolais
        if ((fromCurrency === "$" || fromCurrency === "USD") && toCurrency === "FC") {
            return amount * globalRate;
        }
        // Si on convertit du Franc Congolais vers le Dollar
        if (fromCurrency === "FC" && (toCurrency === "$" || toCurrency === "USD")) {
            return amount / globalRate;
        }
        return amount; 
    }

    // --- 4. CHARGEMENT & ACTIONS SUPABASE ---
    async function fetchExpenses() {
    const loader = document.getElementById('loading-state');
    try {
        const { data: { user } } = await _db.auth.getUser();
        if (!user) return;

        if (loader) loader.style.display = 'flex';

        const { data, error } = await _db
            .from('expenses')
            .select('*')
            .eq('user_id', user.id)
            .order('date', { ascending: false });

        if (error) throw error;
        expenses = data || [];
        renderExpenses();
    } catch (err) {
        console.error("Erreur:", err.message);
    } finally {
        if (loader) loader.style.display = 'none';
    }
}

    async function addExpense() {
    const { data: { user } } = await _db.auth.getUser();
    if (!user) return alert("Session expirée");

    const date = document.getElementById('expenseDate').value;
    const label = document.getElementById('expenseLabel').value.trim();
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    
    // On récupère la devise choisie pour CETTE dépense précise
    const specificCurrency = document.getElementById('inputCurrency').value; 
    const category = document.getElementById('expenseCategory').value;

    if(!label || isNaN(amount)) return alert("Veuillez remplir le libellé et le montant.");

    const { error } = await _db
    .from('expenses')
    .insert([{ 
        label: label, 
        amount: amount, 
        category: category, 
        date: date,
        currency: window.currentCurrency, // ON ENREGISTRE LA DEVISE GLOBALE ACTUELLE
        user_id: user.id 
    }]);

    if (error) {
        alert("Erreur: " + error.message);
    } else {
        // Reset des champs
        document.getElementById('expenseLabel').value = '';
        document.getElementById('expenseAmount').value = '';
        fetchExpenses(); 
    }
}
    async function deleteExpense(id) {
        if(confirm("Supprimer cette dépense ?")) {
            const { error } = await _db.from('expenses').delete().eq('id', id);
            if (!error) fetchExpenses();
        }
    }

    // --- 5. RENDU DU TABLEAU (CORRIGÉ POUR L'ERREUR VALUE) ---
    function renderExpenses() {
    const table = document.getElementById('expensesTable');
    if (!table) return;

    const currencySelector = document.getElementById('expenseCurrency');
    const targetCurrency = currencySelector ? currencySelector.value : (window.currentCurrency || "FC");
    const totalDisplay = document.getElementById('expensesTotal');
    
    const pending = typeof OfflineManager !== 'undefined' ? OfflineManager.getQueue() : [];
    const allExpenses = [...pending, ...expenses]; 

    table.innerHTML = '';
    let totalGlobal = 0;

    allExpenses.forEach(e => {
        const displayLabel = e.label || e.description || 'Sans nom';
        const expenseAmount = e.amount || 0;
        const currentSystemCurrency = window.currentCurrency || "FC"; 
        totalGlobal += expenseAmount;

        // --- ICONE SYNC ---
        const iconSync = e.isOffline 
            ? `<svg title="En attente" style="width:18px;height:18px;color:#ffa500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19L19 21L22 18M16 10c.279 0 .55.033.81.094a5.96 5.96 0 0 1 1.625-1.587c.042-.028.085-.053.128-.078c.036-.022.072-.044.11-.064c.28-.148.58-.27.89-.364C19.13 5.43 16.81 3 14 3c-2.598 0-4.785 1.944-5.133 4.468C7.035 7.18 5.12 8.16 4 10c-2.21 0-4 1.79-4 4s1.79 4 4 4h7"></path></svg>`
            : `<svg title="Synchronisé" style="width:18px;height:18px;color:#28a745" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;

        // --- BOUTON OEIL (VÉRIFICATION URL) ---
        // On vérifie si l'URL existe et si elle n'est pas vide
        let receiptBtn = '';
        if (e.receipt_url && e.receipt_url.length > 10) {
            receiptBtn = `
                <a href="${e.receipt_url}" target="_blank" class="btn-view-receipt" title="Voir la facture originale">
                    <svg style="width:18px;height:18px;color:#313c63" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </a>`;
        }

        const row = document.createElement('tr');
        if (e.isOffline) row.style.opacity = "0.7";

        row.innerHTML = `
            <td style="display: flex; align-items: center; gap: 8px;">
                ${iconSync}
                <span>${e.date ? new Date(e.date).toLocaleDateString('fr-FR') : '-'}</span>
            </td>
            <td style="font-weight:600">${displayLabel}</td>
            <td><span class="badge-cat">${e.category || 'Général'}</span></td>
            <td style="color:var(--text-light); font-size:0.9em;">
                ${expenseAmount.toLocaleString()} ${currentSystemCurrency}
            </td>
            <td style="font-weight:700; color:var(--danger)">
                - ${expenseAmount.toLocaleString(undefined, {minimumFractionDigits:2})} ${currentSystemCurrency}
            </td>
            <td style="text-align: right;">
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
                    ${receiptBtn}
                    ${e.isOffline ? 
                        `<small style="color:#ffa500; font-style:italic;">En attente...</small>` : 
                        `<button onclick="deleteExpense('${e.id}')" class="btn-delete" title="Supprimer">
                            <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>`
                    }
                </div>
            </td>
        `;
        table.appendChild(row);
    });

    if (totalDisplay) {
        totalDisplay.textContent = totalGlobal.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " " + targetCurrency;
    }
}

    // --- 6. AUTRES FONCTIONS ---
    function filterExpenses() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#expensesTable tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    function exportExpensesExcel() {
        const currencySelector = document.getElementById('expenseCurrency');
        const targetCurrency = currencySelector ? currencySelector.value : currentCurrency;

        const wsData = [["Date", "Libellé", "Catégorie", "Montant Original", "Devise", `Valeur en ${targetCurrency}`]];
        expenses.forEach(e => {
            const converted = convertCurrency(e.amount, e.currency, targetCurrency);
            wsData.push([e.date, e.label, e.category, e.amount, e.currency, converted.toFixed(2)]);
        });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dépenses");
        XLSX.writeFile(wb, `Depenses_${new Date().toLocaleDateString()}.xlsx`);
    }

    async function logout() {
    if(confirm("Se déconnecter ?")) {
        await _db.auth.signOut(); // Déconnexion réelle de Supabase
        localStorage.removeItem('sb-oysdycuouodarfkmdtop-auth-token'); // Nettoyage propre
        window.location.href = "index.html";
    }
}
    async function exportExpensesPDF() {
    // 1. Vérifications initiales
    if (!window.jspdf) return alert("Erreur: Bibliothèque jsPDF non trouvée.");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();

    // 2. Récupération des paramètres et données
    const currencySelector = document.getElementById('expenseCurrency');
    const targetCurrency = currencySelector ? currencySelector.value : (window.currentCurrency || "FC");
    const totalGlobalText = document.getElementById('expensesTotal')?.textContent || "0";

    const { data: { user } } = await _db.auth.getUser();
    const { data: settings } = await _db.from('settings').select('*').eq('user_id', user?.id).maybeSingle();

    const bizName = settings?.company_name || "MONITEO PRO";
    const bizLogo = settings?.logo_url || null;

    // --- EN-TÊTE ---
    if (bizLogo) {
        try { doc.addImage(bizLogo, 'PNG', 14, 10, 20, 20); } catch (e) {}
    }
    doc.setFontSize(16).setTextColor(31, 60, 99).setFont("helvetica", "bold");
    doc.text(bizName.toUpperCase(), bizLogo ? 40 : 14, 20);
    doc.setFontSize(9).setFont("helvetica", "normal").setTextColor(100);
    doc.text(`Rapport de Dépenses - Généré le ${new Date().toLocaleDateString('fr-FR')}`, bizLogo ? 40 : 14, 26);

    // --- PRÉPARATION DU TABLEAU ---
    const tableBody = expenses.map(e => {
        const expenseCurrency = e.currency || "FC";
        const converted = typeof convertCurrency === 'function' 
            ? convertCurrency(e.amount, expenseCurrency, targetCurrency) 
            : e.amount;

        return [
            e.date ? new Date(e.date).toLocaleDateString('fr-FR') : '-',
            e.label || 'Sans nom',
            e.category || 'Général',
            `${(e.amount || 0).toLocaleString()} ${expenseCurrency}`,
            `${converted.toLocaleString(undefined, {minimumFractionDigits:2})} ${targetCurrency}`,
            "" // Colonne "Preuve" vide pour le didDrawCell
        ];
    });

    // --- GÉNÉRATION DU TABLEAU ---
    doc.autoTable({
        startY: 35,
        head: [['Date', 'Libellé', 'Catégorie', 'Montant Orig.', `Total (${targetCurrency})`, 'Preuve']],
        body: tableBody,
        theme: 'striped',
        headStyles: { fillColor: [31, 60, 99], fontSize: 9 },
        styles: { fontSize: 8, cellPadding: 3 },
        columnStyles: {
            5: { cellWidth: 25, halign: 'center' }
        },
        // Ajout du pied de page pour le Total Général
        foot: [[ '', '', '', 'TOTAL GÉNÉRAL', totalGlobalText, '' ]],
        footStyles: { fillColor: [240, 240, 240], textColor: [0,0,0], fontStyle: 'bold' },

        didDrawCell: (data) => {
            if (data.section === 'body' && data.column.index === 5) {
                const expense = expenses[data.row.index];
                if (expense && expense.receipt_url) {
                    doc.setFontSize(7);
                    doc.setTextColor(0, 0, 255);
                    
                    const text = "VOIR REÇU";
                    const textWidth = doc.getTextWidth(text);
                    const x = data.cell.x + (data.cell.width - textWidth) / 2;
                    const y = data.cell.y + (data.cell.height / 2) + 2;

                    doc.text(text, x, y);
                    doc.line(x, y + 0.5, x + textWidth, y + 0.5); // Soulignement fin
                    doc.link(data.cell.x, data.cell.y, data.cell.width, data.cell.height, { url: expense.receipt_url });
                } else {
                    doc.setTextColor(150);
                    doc.text("-", data.cell.x + (data.cell.width / 2), data.cell.y + (data.cell.height / 2) + 2, { align: 'center' });
                }
            }
        }
    });

    doc.save(`Rapport_Depenses_${bizName.replace(/\s+/g, '_')}.pdf`);
}

function toggleDropdown(event, menuId) {
    if (event) {
        event.stopPropagation();
    }
    
    const menu = document.getElementById(menuId);
    if (!menu) return;

    // Fermer les autres menus
    document.querySelectorAll('.dropdown-menu').forEach(m => {
        if (m.id !== menuId) {
            m.classList.remove('show');
        }
    });

    menu.classList.toggle('show');
}

// Gestionnaire de clic global
window.onclick = function(event) {
    if (!event.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown-menu').forEach(m => {
            m.classList.remove('show');
        });
    }
};

async function addExpense() {
    const labelEl = document.getElementById('expenseLabel');
    const amountEl = document.getElementById('expenseAmount');
    const catEl = document.getElementById('expenseCategory');
    const dateEl = document.getElementById('expenseDate');
    const fileEl = document.getElementById('expenseReceipt'); // Assurez-vous d'avoir cet ID dans le HTML

    const label = labelEl.value.trim();
    const amount = parseFloat(amountEl.value);
    const category = catEl.value;
    const date = dateEl.value;
    const receiptFile = fileEl ? fileEl.files[0] : null;

    if (!label || isNaN(amount)) return alert("Veuillez remplir le libellé et le montant.");

    let userId = localStorage.getItem('moniteo_user_id');
    
    // Vérification de l'ID utilisateur (tentative de refresh si nul)
    if (!userId) {
        try {
            const { data } = await _db.auth.getUser();
            if (data?.user) {
                userId = data.user.id;
                localStorage.setItem('moniteo_user_id', userId);
            }
        } catch (e) { console.error(e); }
    }

    if (!userId) return alert("Erreur d'identification. Reconnectez-vous.");

    // Gestion de l'upload d'image (uniquement si en ligne)
    let receiptUrl = null;
    if (navigator.onLine && receiptFile) {
        // Affiche un indicateur de chargement si nécessaire
        receiptUrl = await uploadReceiptFile(receiptFile); 
    }

    const expenseData = {
        label,
        amount,
        category,
        date,
        user_id: userId,
        currency: window.currentCurrency || "FC",
        receipt_url: receiptUrl // On stocke l'URL de l'image
    };

    if (!navigator.onLine) {
        if (typeof OfflineManager !== 'undefined') {
            OfflineManager.saveLocally(expenseData);
            alert("📍 Enregistré localement (sans image - hors-ligne)");
            resetForm();
            renderExpenses();
        }
    } else {
        try {
            const { error } = await _db.from('expenses').insert([expenseData]);
            if (error) throw error;
            
            alert("✅ Dépense enregistrée avec succès");
            resetForm();
            fetchExpenses();
        } catch (err) {
            console.error("Erreur serveur:", err);
            OfflineManager.saveLocally(expenseData);
            renderExpenses();
        }
    }

    // Petite fonction interne pour vider le formulaire
    function resetForm() {
        labelEl.value = '';
        amountEl.value = '';
        if (fileEl) fileEl.value = '';
    }
}
async function uploadReceiptFile(file) {
    if (!file) return null;

    const fileExt = file.name.split('.').pop();
    const fileName = `${Math.random()}_${Date.now()}.${fileExt}`;
    const filePath = `${fileName}`;

    try {
        const { data, error } = await _db.storage
            .from('receipts')
            .upload(filePath, file);

        if (error) throw error;

        // Récupérer l'URL publique
        const { data: { publicUrl } } = _db.storage
            .from('receipts')
            .getPublicUrl(filePath);

        return publicUrl;
    } catch (err) {
        console.error("Erreur Upload:", err.message);
        return null;
    }
}
