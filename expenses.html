<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    let expenses = [];
    let globalRate = 2200; // Taux par défaut si non trouvé

    // --- 2. INITIALISATION ---
    document.addEventListener('DOMContentLoaded', async () => {
        applyGlobalSettings();
        
        if(document.getElementById('expenseDate')) {
            document.getElementById('expenseDate').valueAsDate = new Date();
        }
        
        // Charger les données depuis Supabase
        fetchExpenses();

        const currencySelector = document.getElementById('expenseCurrency');
        if(currencySelector) {
            currencySelector.addEventListener('change', renderExpenses);
        }
    });

    function applyGlobalSettings() {
        const config = JSON.parse(localStorage.getItem('moniteo_config')) || {};
        
        if (config.darkMode) document.body.classList.add('dark-mode');

        currentCurrency = config.currency || "FC";
        globalRate = parseFloat(config.rate) || 2800;
        
        const select = document.getElementById('expenseCurrency');
        if (select) select.value = currentCurrency;

        const brandName = document.querySelector('.header-flex h2');
        if (brandName && config.name) {
            brandName.innerHTML = `Dépenses <small style="font-size: 0.6em; color: var(--secondary)">| ${config.name}</small>`;
        }
    }

    // --- 3. LOGIQUE DE CALCUL (DYNAMIQUE) ---
    function convertCurrency(amount, fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return amount;
        
        // Si on convertit du Dollar vers le Franc Congolais
        if ((fromCurrency === "$" || fromCurrency === "USD") && toCurrency === "FC") {
            return amount * globalRate;
        }
        // Si on convertit du Franc Congolais vers le Dollar
        if (fromCurrency === "FC" && (toCurrency === "$" || toCurrency === "USD")) {
            return amount / globalRate;
        }
        return amount; 
    }

    // --- 4. CHARGEMENT & ACTIONS SUPABASE ---
    async function fetchExpenses() {
    const { data: { user } } = await _db.auth.getUser();
    if (!user) return;

    const { data, error } = await _db
        .from('expenses')
        .select('*')
        .eq('user_id', user.id) // Filtrer pour ne voir que SES dépenses
        .order('date', { ascending: false });

    if (!error) {
        expenses = data || [];
        renderExpenses();
    }
}

    async function addExpense() {
    const { data: { user } } = await _db.auth.getUser();
    if (!user) return alert("Session expirée");

    const date = document.getElementById('expenseDate').value;
    const label = document.getElementById('expenseLabel').value.trim();
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    
    // On récupère la devise choisie pour CETTE dépense précise
    const specificCurrency = document.getElementById('inputCurrency').value; 
    const category = document.getElementById('expenseCategory').value;

    if(!label || isNaN(amount)) return alert("Veuillez remplir le libellé et le montant.");

    const { error } = await _db.from('expenses').insert([{ 
        user_id: user.id,
        date: date,
        label: label,      // Maintenant reconnu grâce au SQL ci-dessus
        amount: amount,
        currency: specificCurrency, // Enregistre FC ou USD selon ton choix
        category: category
    }]);

    if (error) {
        alert("Erreur: " + error.message);
    } else {
        // Reset des champs
        document.getElementById('expenseLabel').value = '';
        document.getElementById('expenseAmount').value = '';
        fetchExpenses(); 
    }
}
    async function deleteExpense(id) {
        if(confirm("Supprimer cette dépense ?")) {
            const { error } = await _db.from('expenses').delete().eq('id', id);
            if (!error) fetchExpenses();
        }
    }

    // --- 5. RENDU DU TABLEAU (CORRIGÉ POUR L'ERREUR VALUE) ---
    function renderExpenses() {
    const table = document.getElementById('expensesTable');
    if(!table) return;

    const currencySelector = document.getElementById('expenseCurrency');
    const targetCurrency = currencySelector ? currencySelector.value : currentCurrency;
    
    const totalDisplay = document.getElementById('expensesTotal');
    table.innerHTML = '';
    let totalGlobal = 0;

    expenses.forEach(e => {
        // 1. RÉCUPÉRATION DU LIBELLÉ (Vérifie 'label' puis 'description')
        const displayLabel = e.label || e.description || 'Sans nom';

        // 2. GESTION DE LA DEVISE LIGNE PAR LIGNE
        const expenseCurrency = e.currency || "FC"; 
        const convertedAmount = convertCurrency(e.amount, expenseCurrency, targetCurrency);
        totalGlobal += convertedAmount;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${e.date ? new Date(e.date).toLocaleDateString('fr-FR') : '-'}</td>
            <td style="font-weight:600">${displayLabel}</td>
            <td><span class="badge-cat">${e.category || 'Général'}</span></td>
            <td style="color:var(--text-light); font-size:0.9em;">
                ${(e.amount || 0).toLocaleString()} ${expenseCurrency}
            </td>
            <td style="font-weight:700; color:var(--danger)">
                - ${convertedAmount.toLocaleString(undefined, {minimumFractionDigits:2})} ${targetCurrency}
            </td>
            <td style="text-align: right;">
                <button onclick="deleteExpense('${e.id}')" class="btn-delete">
                    <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </td>
        `;
        table.appendChild(row);
    });

    if(totalDisplay) {
        totalDisplay.textContent = totalGlobal.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " " + targetCurrency;
    }
}

    // --- 6. AUTRES FONCTIONS ---
    function filterExpenses() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#expensesTable tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    function exportExpensesExcel() {
        const currencySelector = document.getElementById('expenseCurrency');
        const targetCurrency = currencySelector ? currencySelector.value : currentCurrency;

        const wsData = [["Date", "Libellé", "Catégorie", "Montant Original", "Devise", `Valeur en ${targetCurrency}`]];
        expenses.forEach(e => {
            const converted = convertCurrency(e.amount, e.currency, targetCurrency);
            wsData.push([e.date, e.label, e.category, e.amount, e.currency, converted.toFixed(2)]);
        });
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dépenses");
        XLSX.writeFile(wb, `Depenses_${new Date().toLocaleDateString()}.xlsx`);
    }

    async function logout() {
    if(confirm("Se déconnecter ?")) {
        await _db.auth.signOut(); // Déconnexion réelle de Supabase
        localStorage.removeItem('sb-oysdycuouodarfkmdtop-auth-token'); // Nettoyage propre
        window.location.href = "index.html";
    }
}
    async function exportExpensesPDF() {
    // Vérification de sécurité
    if (!window.jspdf) return alert("Erreur: Bibliothèque jsPDF non trouvée.");
    if (!window.jspdf.jsPDF.API.autoTable) return alert("Erreur: Plugin autoTable non trouvé. Vérifiez vos scripts imports.");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();

    // 1. Récupération de l'utilisateur
    const { data: { user } } = await _db.auth.getUser();
    if (!user) return alert("Session expirée");

    // 2. Infos entreprise
    const { data: settings } = await _db
        .from('settings')
        .select('*')
        .eq('user_id', user.id)
        .maybeSingle();

    const bizName = settings?.company_name || "MONITEO PRO";
    const bizLogo = settings?.logo_url || null;
    const currencySelector = document.getElementById('expenseCurrency');
    const targetCurrency = currencySelector ? currencySelector.value : currentCurrency;

    // --- EN-TÊTE ---
    if (bizLogo) {
        try { doc.addImage(bizLogo, 'PNG', 14, 10, 25, 25); } catch (e) {}
    }
    doc.setFontSize(18);
    doc.setTextColor(31, 60, 99);
    doc.text(bizName.toUpperCase(), bizLogo ? 45 : 14, 20);
    doc.setFontSize(9);
    doc.setTextColor(100);
    doc.text(`Rapport des Dépenses - ${new Date().toLocaleDateString('fr-FR')}`, bizLogo ? 45 : 14, 26);

    // --- TABLEAU ---
    const totalGlobal = document.getElementById('expensesTotal')?.textContent || "0";
    const tableBody = expenses.map(e => {
        const expenseCurrency = e.currency || "FC";
        const converted = convertCurrency(e.amount, expenseCurrency, targetCurrency);
        return [
            e.date ? new Date(e.date).toLocaleDateString('fr-FR') : '-',
            e.label || 'Sans nom',
            e.category || 'Général',
            `${(e.amount || 0).toLocaleString()} ${expenseCurrency}`,
            `${converted.toLocaleString(undefined, {minimumFractionDigits:2})} ${targetCurrency}`
        ];
    });

    // Appel de autoTable
    doc.autoTable({
        startY: 40,
        head: [['Date', 'Libellé', 'Catégorie', 'Montant Orig.', `Total (${targetCurrency})`]],
        body: tableBody,
        headStyles: { fillColor: [31, 60, 99] },
        foot: [[ '', '', '', 'TOTAL GÉNÉRAL', totalGlobal ]],
        footStyles: { fillColor: [240, 240, 240], textColor: [0,0,0], fontStyle: 'bold' }
    });

    doc.save(`Depenses_${bizName.replace(/\s+/g, '_')}.pdf`);
}
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    
    sidebar.classList.toggle('collapsed');
    
    // Optionnel : Sauvegarder l'état dans le navigateur
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('sidebarStatus', isCollapsed ? 'collapsed' : 'expanded');
}

// Au chargement de la page, appliquer l'état sauvegardé
window.addEventListener('DOMContentLoaded', () => {
    const status = localStorage.getItem('sidebarStatus');
    const sidebar = document.getElementById('sidebar');
    if (status === 'collapsed') {
        sidebar.classList.add('collapsed');
    }
});
</script>
