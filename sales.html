<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moniteo Umbrella - Ventes Pro</title>

    <script>
        if (sessionStorage.getItem('isLogged') !== 'true') {
            window.location.href = "index.html";
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root {
            --primary:#1f3c63; --secondary:#3b82f6; --success:#10b981; --danger:#ef4444;
            --text-main:#1e293b; --text-light:#64748b; --bg-body:#f1f5f9; --bg-card:#ffffff;
            --border-soft:#e2e8f0; --sidebar-w:260px;
        }

        /* --- MODE SOMBRE --- */
        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-light: #94a3b8;
            --border-soft: #334155;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:Inter,sans-serif; }
        body { display:flex; height: 100vh; background:var(--bg-body); color:var(--text-main); transition: 0.3s; }

        .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); height: 100vh; background: var(--primary);
            color: #fff; padding: 1rem; display: flex; flex-direction: column; transition: 0.3s;
        }
        .sidebar.collapsed { width: 80px; }
        .sidebar.collapsed span, .sidebar.collapsed .logo-full { display: none; }
        .sidebar.collapsed .logo-short { display: block; }
        
        .logo-box { padding: 1rem 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 1.5rem; }
        .logo-full { width: 140px; }
        .logo-short { display: none; width: 40px; margin: 0 auto; }

        .nav-links { list-style:none; flex:1; }
        .nav-links a {
            display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:10px;
            text-decoration:none; color:rgba(255,255,255,.7); font-size:.9rem; transition:.2s;
        }
        .nav-links a.active, .nav-links a:hover { background:rgba(255,255,255,0.1); color:#fff; }

        /* --- CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; }
        .header-flex { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
        
        .summary-banner {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;
            background: var(--primary); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;
        }
        .summary-banner small { opacity: 0.7; font-size: 0.7rem; text-transform: uppercase; }
        .summary-banner p { font-size: 1.5rem; font-weight: 700; }

        .card { background:var(--bg-card); padding:1.5rem; border-radius:12px; border: 1px solid var(--border-soft); margin-bottom: 1.5rem; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--text-light); border-bottom: 2px solid var(--border-soft); }
        td { padding: 12px; border-bottom: 1px solid var(--border-soft); }

        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-main { background: var(--secondary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border-soft); color: var(--text-main); }
        .btn-danger { background: #fee2e2; color: var(--danger); }

        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .chart-wrapper { height: 300px; }

        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
            .sidebar { display: none; } /* On pourrait ajouter un menu burger ici */
        }
    </style>
</head>
<body>

   <nav class="sidebar" id="sidebar">
			<div class="logo-box">

						<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

			<div style="padding: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
				<a href="#" onclick="logout(); return false;" style="color:#ff6b6b; text-decoration:none; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:10px; padding:12px 15px;">
					<svg class="icon" viewBox="0 0 24 24">

    <main class="main-content">
        <header class="header-flex">
            <h2 id="pageTitle">Gestion des Ventes</h2>
            <div id="dynamicLogoContainer"></div>
        </header>

        <div class="summary-banner">
            <div><small>Chiffre d'Affaires</small><p id="totalSales">0</p></div>
            <div><small>Bénéfice Brut</small><p id="totalProfit">0</p></div>
            <div><small>Articles Vendus</small><p id="totalQuantity">0</p></div>
        </div>

        <div class="action-bar">
            <button class="btn-main" onclick="addRow()">+ Nouvelle Vente</button>
            <button class="btn-outline" onclick="undo()">Annuler</button>
            <button class="btn-outline" onclick="exportPDF()">PDF</button>
            <button class="btn-outline" onclick="exportExcel()">Excel</button>
            <button class="btn-danger" onclick="deleteSelectedRow()">Supprimer</button>
            <button class="btn-main" style="background:#10b981" onclick="closeDay()">Clôturer Journée</button>
            <button class="btn-outline" onclick="document.getElementById('excelFileInput').click()">Importer Excel</button>
<input type="file" id="excelFileInput" style="display:none" accept=".xlsx, .xls, .csv" onchange="importExcel(event)">
        </div>

        <div class="card">
            <input type="text" id="filterProduct" oninput="renderTable(this.value)" placeholder="Rechercher une vente..." style="width:100%; padding: 12px; border: 1px solid var(--border-soft); border-radius: 10px; margin-bottom: 1rem; background: var(--bg-body); color: var(--text-main);">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" onclick="toggleSelectAll(this)"></th>
                            <th>Produit</th>
                            <th>Date</th>
                            <th>Achat</th>
                            <th>Vente</th>
                            <th>Qté</th>
                            <th>Bénéfice</th>
                        </tr>
                    </thead>
                    <tbody id="salesTable"></tbody>
                </table>
            </div>
        </div>

        <div class="charts-container">
            <div class="card chart-wrapper"><canvas id="salesChart"></canvas></div>
            <div class="card chart-wrapper"><canvas id="profitChart"></canvas></div>
        </div>
    </main>

   <script>
    let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
    let undoStack = [];
    let currentCurrency = "€";
    let salesChart, profitChart;

    // --- INITIALISATION ---
    function applyGlobalConfig() {
        const config = JSON.parse(localStorage.getItem('moniteo_config')) || {};
        currentCurrency = config.currency || "€";
        if (config.darkMode) document.body.classList.add('dark');
        if (config.name) document.getElementById('pageTitle').textContent = `Ventes | ${config.name}`;
        if (config.logo) {
            document.getElementById('dynamicLogoContainer').innerHTML = `<img src="${config.logo}" id="companyLogo" style="height:40px; border-radius:5px;">`;
        }
    }

    // --- LOGIQUE DE STOCK TEMPS RÉEL ---
    function adjustInventoryStock(productName, quantityChange, isHorsStock) {
        if (!productName || isHorsStock) return;
        let inventory = JSON.parse(localStorage.getItem('inventoryData')) || [];
        // Utilisation de .product pour correspondre à ton inventaire
        let item = inventory.find(i => i.product.trim().toLowerCase() === productName.trim().toLowerCase());
        
        if (item) {
            item.qty = (parseInt(item.qty) || 0) + quantityChange;
            localStorage.setItem('inventoryData', JSON.stringify(inventory));
            window.dispatchEvent(new Event('storage')); // Notifie l'onglet inventaire
        }
    }

    // --- LIAISON INVENTAIRE & TABLEAU ---
    function renderTable(filter = '') {
        const tbody = document.getElementById('salesTable');
        const inventory = JSON.parse(localStorage.getItem('inventoryData')) || [];
        tbody.innerHTML = '';
        
        let totalS = 0, totalP = 0, totalQ = 0;

        salesData.forEach((s, index) => {
            if(s.product.toLowerCase().includes(filter.toLowerCase())) {
                const profit = (parseFloat(s.sell) - parseFloat(s.buy)) * parseInt(s.qty);
                totalS += parseFloat(s.sell) * parseInt(s.qty);
                totalP += profit;
                totalQ += parseInt(s.qty);

                // Construction des options : désactivé si stock <= 0
                const options = inventory.map(item => {
                    const isOutOfStock = (parseInt(item.qty) <= 0);
                    return `<option value="${item.product}" 
                        ${item.product === s.product ? 'selected' : ''} 
                        ${isOutOfStock && item.product !== s.product ? 'disabled' : ''}>
                        ${item.product} ${isOutOfStock ? '(RUPTURE)' : `(Stock: ${item.qty})`}
                    </option>`;
                }).join('');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="row-check"></td>
                    <td>
                        <select onchange="handleSelectProduct(${index}, this)" style="width:100%; background:transparent; color:inherit; border:none; font-weight:600; cursor:pointer;">
                            <option value="">-- Choisir Produit --</option>
                            <optgroup label="Inventaire">
                                ${options}
                            </optgroup>
                            <optgroup label="Autre">
                                <option value="HORS_STOCK" ${s.isHorsStock ? 'selected' : ''}>+ Produit hors stock</option>
                            </optgroup>
                        </select>
                    </td>
                    <td contenteditable="true" onblur="updateRow(${index}, 'date', this)">${s.date}</td>
                    <td style="opacity:0.7;">${s.buy}</td>
                    <td contenteditable="true" onblur="updateRow(${index}, 'sell', this)">${s.sell}</td>
                    <td contenteditable="true" onfocus="this.oldValue = this.innerText" onblur="updateQuantity(${index}, this)">${s.qty}</td>
                    <td style="font-weight:bold; color:${profit >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${profit.toFixed(2)} ${currentCurrency}
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });

        document.getElementById('totalSales').textContent = totalS.toLocaleString() + " " + currentCurrency;
        document.getElementById('totalProfit').textContent = totalP.toLocaleString() + " " + currentCurrency;
        document.getElementById('totalQuantity').textContent = totalQ;
        
        localStorage.setItem('salesData', JSON.stringify(salesData));
        updateCharts();
    }

    // Gestion intelligente du menu déroulant
    function handleSelectProduct(index, selectElement) {
        const val = selectElement.value;
        
        if (val === "HORS_STOCK") {
            const customName = prompt("Nom du produit hors stock :");
            if (customName) {
                saveUndo();
                // Si on remplace un produit d'inventaire, on rend son stock
                if (salesData[index].product && !salesData[index].isHorsStock) {
                    adjustInventoryStock(salesData[index].product, parseInt(salesData[index].qty), false);
                }
                salesData[index].product = customName;
                salesData[index].isHorsStock = true;
                salesData[index].buy = 0;
                salesData[index].sell = 0;
                renderTable();
            } else {
                selectElement.value = ""; 
            }
        } else {
            // Produit de l'inventaire
            saveUndo();
            const inventory = JSON.parse(localStorage.getItem('inventoryData')) || [];
            const item = inventory.find(i => i.product === val);
            
            // On rend le stock de l'ancien produit s'il existait
            if (salesData[index].product && !salesData[index].isHorsStock) {
                adjustInventoryStock(salesData[index].product, parseInt(salesData[index].qty), false);
            }

            if(item) {
                salesData[index].product = item.product;
                salesData[index].isHorsStock = false;
                salesData[index].buy = item.buy || 0;
                salesData[index].sell = item.sell || 0;
                // On déduit le stock du nouveau produit
                adjustInventoryStock(item.product, -parseInt(salesData[index].qty), false);
            }
            renderTable();
        }
    }

    function updateQuantity(index, el) {
        const newQty = parseInt(el.innerText) || 0;
        const oldQty = parseInt(el.oldValue) || 0;
        const diff = oldQty - newQty; 

        if (diff !== 0) {
            saveUndo();
            salesData[index].qty = newQty;
            // On ajuste le stock seulement si ce n'est pas un produit "Hors Stock"
            if (!salesData[index].isHorsStock) {
                adjustInventoryStock(salesData[index].product, diff, false);
            }
            renderTable();
        }
    }

    function addRow() {
        saveUndo();
        salesData.push({ product: '', date: new Date().toISOString().split('T')[0], buy: 0, sell: 0, qty: 1, isHorsStock: false });
        renderTable();
    }

    function deleteSelectedRow() {
        if(!confirm("Supprimer les lignes sélectionnées ? Le stock sera rendu.")) return;
        saveUndo();
        const checks = document.querySelectorAll('.row-check');
        
        salesData.forEach((sale, i) => {
            if (checks[i].checked && sale.product && !sale.isHorsStock) {
                adjustInventoryStock(sale.product, parseInt(sale.qty), false);
            }
        });

        salesData = salesData.filter((_, i) => !checks[i].checked);
        renderTable();
    }

    function closeDay() {
        if(salesData.length === 0) return alert("Rien à clôturer.");
        if(confirm("Confirmer la clôture ? Les ventes seront archivées.")) {
            let history = JSON.parse(localStorage.getItem('historyData')) || [];
            history.push({ 
                date: new Date().toLocaleString(), 
                totalCA: document.getElementById('totalSales').textContent,
                data: [...salesData] 
            });
            localStorage.setItem('historyData', JSON.stringify(history));
            salesData = []; 
            renderTable();
            alert("✅ Archivage terminé !");
        }
    }

    // --- PDF / GRAPHS / UTILS ---
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const config = JSON.parse(localStorage.getItem('moniteo_config')) || {};
        doc.setFontSize(18);
        doc.text(config.name || "Rapport de Ventes", 14, 22);
        const rows = salesData.map(s => [s.product, s.date, s.qty, `${s.sell} ${currentCurrency}`, `${((s.sell - s.buy) * s.qty).toFixed(2)} ${currentCurrency}`]);
        doc.autoTable({ head: [['Produit', 'Date', 'Qté', 'Vente', 'Profit']], body: rows, startY: 45, theme: 'grid' });
        doc.save(`Ventes_${new Date().toLocaleDateString()}.pdf`);
    }

    function updateRow(index, field, el) {
        salesData[index][field] = el.innerText;
        localStorage.setItem('salesData', JSON.stringify(salesData));
        updateCharts(); 
    }

    function saveUndo() { undoStack.push(JSON.stringify(salesData)); }
    function undo() { if(undoStack.length) { salesData = JSON.parse(undoStack.pop()); renderTable(); } }

    function updateCharts() {
        const canvasSales = document.getElementById('salesChart');
        const canvasProfit = document.getElementById('profitChart');
        if(!canvasSales || !canvasProfit) return;
        const lastItems = salesData.slice(-5);
        const labels = lastItems.map(s => s.product || "...");
        const dataVentes = lastItems.map(s => s.sell * s.qty);
        const dataProfit = lastItems.map(s => (s.sell - s.buy) * s.qty);
        if(salesChart) salesChart.destroy();
        if(profitChart) profitChart.destroy();
        salesChart = new Chart(canvasSales.getContext('2d'), { type: 'bar', data: { labels, datasets: [{ label: 'CA', data: dataVentes, backgroundColor: '#3b82f6' }] } });
        profitChart = new Chart(canvasProfit.getContext('2d'), { type: 'line', data: { labels, datasets: [{ label: 'Profit', data: dataProfit, borderColor: '#10b981' }] } });
    }

    function importExcel(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            saveUndo();
            const newSales = jsonData.map(row => ({
                product: row.Produit || row.product || "Importé",
                date: row.Date || new Date().toISOString().split('T')[0],
                buy: parseFloat(row.Achat || row.buy) || 0,
                sell: parseFloat(row.Vente || row.sell) || 0,
                qty: parseInt(row.Qte || row.qty) || 1,
                isHorsStock: true // Par sécurité, l'import Excel est considéré hors stock pour ne pas casser l'inventaire existant
            }));
            salesData = [...salesData, ...newSales];
            renderTable();
            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }

    function logout() { sessionStorage.clear(); window.location.href="index.html"; }

    document.addEventListener('DOMContentLoaded', () => {
        applyGlobalConfig();
        renderTable();
    });
</script>
