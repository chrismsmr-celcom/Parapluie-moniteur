        try {
            // Utilisation de _db (défini dans auth-check.js)
            const { data, error } = await _db
                .from('sales') // Ou 'staff' selon ce que tu veux afficher ici
                .select('*')
                .eq('user_id', currentUser.id)
                .order('date', { ascending: false });

            if (error) throw error;

            if (data) {
                console.log("Données reçues :", data);
                // Si tu as une variable globale pour stocker les données
                if (typeof salesData !== 'undefined') salesData = data;
                
                // Appelle ta fonction de rendu du tableau
                if (typeof renderTable === 'function') {
                    renderTable();
                } else if (typeof renderStaff === 'function') {
                    renderStaff();
                }
            }
        } catch (err) {
            console.error("Erreur critique lors du chargement :", err.message);
        }
    }
</script>

    <main class="main-content">
        <header class="header-flex">
            <h2>Journal Historique</h2>
            <button class="btn-success" onclick="exportExcel()">Exporter Excel</button>
        </header>

        <div class="summary-banner">
            <div><small>Chiffre d'Affaire</small><p id="caTotal">0 $</p></div>
            <div><small>Bénéfice Net</small><p id="profitTotal">0 $</p></div>
            <div><small>Volume Articles</small><p id="qtyTotal">0</p></div>
            <div><small>Transactions</small><p id="transCount">0</p></div>
        </div>

        <div class="action-bar">
            <input type="text" id="searchProd" class="filter-input" placeholder="Rechercher un produit..." oninput="applyFilters()" style="flex:1;">
            
            <div class="date-range">
                <small style="color:var(--text-light)">Du</small>
                <input type="date" id="dateStart" class="filter-input" style="border:none" onchange="applyFilters()">
                <small style="color:var(--text-light)">Au</small>
                <input type="date" id="dateEnd" class="filter-input" style="border:none" onchange="applyFilters()">
            </div>

            <select id="marketFilter" class="filter-input" onchange="applyFilters()">
                <option value="all">Tous Marchés</option>
                <option value="local">Local</option>
                <option value="export">Export</option>
            </select>
            
            <button class="btn-danger" onclick="resetFilters()">Réinitialiser</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Produit</th>
                        <th>Marché</th>
                        <th>Qté</th>
                        <th>P.U ($)</th>
                        <th>Total ($)</th>
                        <th>Bénéfice ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
    let salesHistory = [];
    // --- 2. INITIALISATION ---
    document.addEventListener('DOMContentLoaded', async () => {
        applyGlobalSettings();
        handleResponsiveSidebar();
        await fetchSalesHistory(); // Charger depuis Supabase
    });

    function applyGlobalSettings() {
        const config = JSON.parse(localStorage.getItem('moniteo_config')) || {};
        if (config.darkMode) document.body.classList.add('dark-mode');

        currentCurrency = config.currency || "FC";

        const brandName = document.querySelector('.header-flex h2');
        if (brandName && config.name) {
            brandName.innerHTML = `Historique <small style="font-size: 0.6em; color: var(--secondary)">| ${config.name}</small>`;
        }
    }

    // --- 3. RÉCUPÉRATION SUPABASE ---
    async function fetchSalesHistory() {
        const { data, error } = await _db
            .from('sales')
            .select('*')
            .order('date', { ascending: false });

        if (error) {
            console.error("Erreur chargement historique:", error.message);
        } else {
            salesHistory = data || [];
            applyFilters(); // Affiche les données avec les filtres actuels
        }
    }

    // --- 4. FILTRAGE ---
    function applyFilters() {
        const query = document.getElementById('searchProd').value.toLowerCase();
        const market = document.getElementById('marketFilter')?.value || 'all';
        const start = document.getElementById('dateStart').value;
        const end = document.getElementById('dateEnd').value;

        const filtered = salesHistory.filter(item => {
            const matchName = item.product.toLowerCase().includes(query);
            const matchMarket = (market === 'all' || item.market === market);
            const matchStart = !start || item.date >= start;
            const matchEnd = !end || item.date <= end;
            return matchName && matchMarket && matchStart && matchEnd;
        });

        renderHistory(filtered);
    }

    function resetFilters() {
        document.getElementById('searchProd').value = '';
        if(document.getElementById('marketFilter')) document.getElementById('marketFilter').value = 'all';
        document.getElementById('dateStart').value = '';
        document.getElementById('dateEnd').value = '';
        renderHistory(salesHistory);
    }

    // --- 5. RENDU DU TABLEAU ---
    function renderHistory(data) {
        const tbody = document.getElementById('historyBody');
        if(!tbody) return;
        tbody.innerHTML = '';
        
        let ca = 0, profit = 0, qtyCount = 0;

        data.forEach((item) => {
            const sPrice = parseFloat(item.sell_price) || 0;
            const bPrice = parseFloat(item.buy_price) || 0;
            const sQty = parseInt(item.qty) || 0;

            const itemTotal = sPrice * sQty;
            const itemProfit = (sPrice - bPrice) * sQty;

            ca += itemTotal;
            profit += itemProfit;
            qtyCount += sQty;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:500">${formatDate(item.date)}</td>
                <td style="font-weight:600; color:var(--primary)">${item.product}</td>
                <td><span class="badge-market ${item.market || 'local'}">${item.market || 'local'}</span></td>
                <td>${sQty}</td>
                <td>${sPrice.toLocaleString()}</td>
                <td style="font-weight:700">${itemTotal.toLocaleString()}</td>
                <td style="color:var(--success); font-weight:600">+${itemProfit.toLocaleString()}</td>
                <td>
                    <button class="btn-danger" style="padding:5px 10px; cursor:pointer; border:none; border-radius:4px; background:var(--danger); color:white;" 
                        onclick="deleteEntry('${item.id}')">🗑</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Mise à jour des KPI
        document.getElementById('caTotal').textContent = ca.toLocaleString() + " " + currentCurrency;
        document.getElementById('profitTotal').textContent = profit.toLocaleString() + " " + currentCurrency;
        document.getElementById('qtyTotal').textContent = qtyCount;
        document.getElementById('transCount').textContent = data.length;
    }

    // --- 6. ACTIONS & UTILITAIRES ---
    async function deleteEntry(id) {
        if(confirm("Supprimer définitivement cette transaction ?")) {
            const { error } = await _db.from('sales').delete().eq('id', id);
            
            if (error) {
                alert("Erreur lors de la suppression: " + error.message);
            } else {
                fetchSalesHistory(); // Recharger la liste
            }
        }
    }

    function formatDate(d) {
        if(!d) return "-";
        const parts = d.split('-');
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d;
    }

    function handleResponsiveSidebar() {
        const width = window.innerWidth;
        const sb = document.getElementById('sidebar');
        if (sb) {
            if (width <= 1024) sb.classList.add('collapsed');
            else sb.classList.remove('collapsed');
        }
    }

    function exportExcel() {
        if (salesHistory.length === 0) {
            alert("Aucune donnée à exporter.");
            return;
        }

        const dataToExport = salesHistory.map(item => ({
            "Date": item.date || "",
            "Produit": item.product || "Sans nom",
            "Marché": item.market || "Local",
            "Quantité": parseInt(item.qty) || 0,
            "Prix Vente": parseFloat(item.sell_price) || 0,
            "Total Vente": (parseFloat(item.sell_price) * parseInt(item.qty)),
            "Profit": ((parseFloat(item.sell_price) - parseFloat(item.buy_price)) * parseInt(item.qty))
        }));

        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Historique");
        XLSX.writeFile(wb, `Historique_Ventes_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function logout() {
        if(confirm("Se déconnecter ?")) { sessionStorage.clear(); window.location.href = "index.html"; }
    }

    window.addEventListener('resize', handleResponsiveSidebar);
    function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    
    sidebar.classList.toggle('collapsed');
    
    // Optionnel : Sauvegarder l'état dans le navigateur
    const isCollapsed = sidebar.classList.contains('collapsed');
    localStorage.setItem('sidebarStatus', isCollapsed ? 'collapsed' : 'expanded');
}

// Au chargement de la page, appliquer l'état sauvegardé
window.addEventListener('DOMContentLoaded', () => {
    const status = localStorage.getItem('sidebarStatus');
    const sidebar = document.getElementById('sidebar');
    if (status === 'collapsed') {
        sidebar.classList.add('collapsed');
    }
});
</script>
</body>
